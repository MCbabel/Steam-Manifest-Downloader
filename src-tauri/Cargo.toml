[package]
name = "steam-manifest-downloader"
version = "1.4.2"
edition = "2021"
license = "GPL-2.0-or-later"

[features]
default = ["default-sources"]
default-sources = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
regex = "1"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
zip = "2"
chrono = { version = "0.4", features = ["serde"] }
dryoc = "0.7"
sevenz-rust = "0.6"
tar = "0.4"
bzip2 = "0.5"
walkdir = "2"
crc32fast = "1"
steam-vent = "0.5"
steam-vent-proto = "0.5"
vdf-reader = "0.3"
aes = "0.8"
cbc = "0.1"
ecb = "0.1"
sha1 = "0.10"
hex = "0.4"
lzma-rs = "0.3"
protobuf = "3.5"
byteorder = "1"
futures = "0.3"
base64 = "0.22"
zstd = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }



